server {
    listen 80;
    server_name _;

    # Co tinh lo phien ban may chu + tech stack (banner disclosure)
    server_tokens on;
    add_header X-Powered-By "PHP/5.6.40" always;
    add_header X-Backend-Server "nexus-edge-01" always;

    root /usr/share/nginx/html;
    index index.html;

    # Phuc vu cac file nhay cam duoi dang text de xem truc tiep tren trinh duyet
    location ~ \.(env|bak|sql|old|conf|ini|ya?ml)$ { default_type text/plain; }
    location ~ \.php$ { default_type text/html; }   # phuc vu tinh, KHONG thuc thi PHP
    location ~ \.map$ { default_type application/json; }   # source map bi de ho (source disclosure)

    # Directory listing co chu dich (autoindex)
    location /uploads/ { autoindex on; autoindex_exact_size off; autoindex_localtime on; }
    location /backup/  { autoindex on; autoindex_exact_size off; }

    # Ton tai nhung "bi chan" -> tra 403 (khac 404) de thay endpoint co that
    location /admin/ { deny all; }

    # Trang trang thai nginx bi de ho
    location = /server-status { stub_status; access_log off; }

    # Dev API (swagger + endpoint an) - proxy sang service api
    location /api/        { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location /swagger-ui/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location = /openapi.json { proxy_pass http://api:8000; proxy_set_header Host $host; }

    # LUU Y: KHONG chan dotfiles -> /.git/ bi phuc vu tinh (cho git-dumper)
    location / { try_files $uri $uri/ =404; }
}
